name: Build Android preview
on:
  workflow_dispatch:
  push:
    paths:
      - android-preview-source.zip
      - .github/workflows/android-test.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Unpack Android project
        run: unzip -q android-preview-source.zip -d android-preview
      - name: Prepare SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check
        working-directory: android-preview
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package test APK
        run: |
          mkdir -p android-download
          cp android-preview/app/build/outputs/apk/debug/app-debug.apk android-download/Prismatic-Drift-0.3.0-test1.apk
          cp android-preview/LICENSE.txt android-preview/CREDITS.txt android-preview/INSTALL-AND-TEST.txt android-download/
          sha256sum android-download/Prismatic-Drift-0.3.0-test1.apk > android-download/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Prismatic-Drift-Android-0.3.0-test1
          path: android-download/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: |
            android-preview/app/build/reports/
          retention-days: 14
